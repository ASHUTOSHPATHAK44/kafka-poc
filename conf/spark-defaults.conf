# =============================================================================
# Mounted at /opt/spark/conf/spark-defaults.conf in every Spark container.
# Edit + restart the Spark services, no image rebuild needed.
# =============================================================================

# --- Iceberg SQL extensions (MERGE INTO, CALL, time travel, ...) -------------
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Iceberg catalog "lakehouse" backed by the REST catalog ------------------
spark.sql.catalog.lakehouse                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                 rest
spark.sql.catalog.lakehouse.uri                  http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse            s3://warehouse/

# --- Object store access: Iceberg S3FileIO straight at MinIO -----------------
# (no hadoop-aws / s3a involved, so there is nothing else to version-match)
spark.sql.catalog.lakehouse.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint          http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true

spark.sql.defaultCatalog                         lakehouse

# --- Small-cluster sane defaults --------------------------------------------
spark.sql.shuffle.partitions                     4
spark.ui.port                                    4040
spark.eventLog.enabled                           true
spark.eventLog.dir                               file:/opt/spark/events
spark.history.fs.logDirectory                    file:/opt/spark/events
